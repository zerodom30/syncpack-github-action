name: 'syncpack GitHub Action'
description: 'Keep package.json / lock consistent using Syncpack. Auto-overwrite existing PR and request reviewers.'
author: 'Improved Fork'
inputs:
  github-token:
    description: 'GitHub token with repo permissions'
    required: true
  branch-name:
    description: 'Branch name for the PR (defaults to syncpack/update)'
    required: false
    default: 'syncpack/update'
  reviewers:
    description: 'Comma-separated GitHub usernames or teams to request review'
    required: false
    default: ''
  commit-message:
    description: 'Commit message for updates'
    required: false
    default: 'chore: sync package versions via Syncpack'
runs:
  using: 'node16'
  main: 'dist/run.js'
permissions:
  contents: write
  pull-requests: write
